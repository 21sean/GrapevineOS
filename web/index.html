<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Map style/tile/sprite requests all hit api.mapbox.com; warm the
         TLS connection while the JS bundle is still downloading. -->
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/grapevine.svg" />
    <!-- viewport-fit=cover lets the map run under the notch/home indicator;
         overlays pad themselves back out with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#131118" />
    <!-- Add-to-home-screen: full-bleed dark chrome instead of Safari UI. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grapevine" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="Grapevine · a live map of the San Diego events locals actually go to."
    />
    <title>Grapevine · what locals actually go to</title>

    <!-- Social share cards (Open Graph + Twitter). og-image.png is the one
         asset still to add: a 1200x630 PNG (SVG/WebP won't render on most
         scrapers). Point og:url at the production origin once it's pinned. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grapevine" />
    <meta property="og:title" content="Grapevine · what locals actually go to" />
    <meta
      property="og:description"
      content="A live map of the San Diego events locals actually go to."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grapevine · what locals actually go to" />
    <meta
      name="twitter:description"
      content="A live map of the San Diego events locals actually go to."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
