name: npm dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Audits the complete lockfile, including dev dependencies, without
      # installing packages or executing their lifecycle scripts.
      - run: npm audit --audit-level=low
