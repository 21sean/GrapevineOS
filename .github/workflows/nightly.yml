name: nightly

# The suites that need a model: the guardrail classifier, its calibration
# against the labelled corpus, the LLM judge, and the PyRIT red team. They
# run on a self-hosted runner with Ollama and the models installed (see
# docs/setup.md). A job for a runner that is not registered queues until
# GitHub cancels it a day later, so the schedule only fires once the
# repository variable GPU_RUNNER is set to "true". Manual runs from the
# Actions tab always go ahead.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  model-suites:
    if: github.event_name == 'workflow_dispatch' || vars.GPU_RUNNER == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Model suites
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAPBOX_SECRET_TOKEN: ci-placeholder
        run: >
          npm run evals -- --json
          --suite guardrails --suite guardrails-calibration
          --suite guardrails-judge --suite guardrails-redteam
          > nightly.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-evals
          path: nightly.json
