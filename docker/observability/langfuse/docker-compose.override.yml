# Local additions on top of the official docker-compose.yml (auto-merged).
#
# grapevine-bridge: Langfuse restricts webhook deliveries to ports 80/443,
# and the Grapevine API listens on host port 8787. This Caddy sidecar sits
# inside the compose network on port 80 (never published to the host) and
# forwards to the API, so alert automations can point at
# http://grapevine-bridge/api/alerts/langfuse. The webhook SSRF whitelist
# below is what lets Langfuse resolve the sidecar's private address.
services:
  grapevine-bridge:
    image: docker.io/caddy:2-alpine
    restart: always
    command: caddy reverse-proxy --from :80 --to host.docker.internal:8787
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # LANGFUSE_CODE_EVAL_DISPATCHER: the 3 CODE templates in Langfuse's managed
  # evaluator library (all-caps, exact-match, keyword-match) are rejected with
  # 403 "Code evals are not enabled" unless a dispatcher is configured. The
  # "insecure-local" dispatcher runs the TypeScript snippet inside the worker
  # process itself, with no sandbox, so it is only acceptable because this
  # stack is a single-user deployment bound to localhost and the only code it
  # ever runs is the three Langfuse-authored snippets. Do not set this on a
  # stack that accepts evaluator definitions from anyone else. Python code
  # evaluators are not supported by this dispatcher, only TypeScript.
  langfuse-web:
    environment:
      LANGFUSE_WEBHOOK_WHITELISTED_HOST: grapevine-bridge
      LANGFUSE_CODE_EVAL_DISPATCHER: insecure-local

  langfuse-worker:
    environment:
      LANGFUSE_WEBHOOK_WHITELISTED_HOST: grapevine-bridge
      LANGFUSE_CODE_EVAL_DISPATCHER: insecure-local
