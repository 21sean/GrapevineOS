[project]
name = "grapevine-llm"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.11,<3", "pydantic-settings>=2.8,<3", "instructor>=1.10,<2",
  "jsonschema[format]>=4.23,<5", "httpx>=0.28,<1", "opentelemetry-sdk>=1.30,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "hypothesis>=6.130,<7", "ruff>=0.11,<1"]
eval = ["ragas>=0.3,<0.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
